name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: go test ./...

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Generate throwaway JWT keypair for the stack
        run: |
          mkdir -p deploy/compose/secrets
          # auth-svc signs with Ed25519 (see pkg/security/jwt.go) - RSA is rejected.
          openssl genpkey -algorithm ed25519 -out deploy/compose/secrets/auth_priv.pem
          openssl pkey -in deploy/compose/secrets/auth_priv.pem -pubout -out deploy/compose/secrets/auth_pub.pem
      - name: Bring up the stack
        working-directory: deploy/compose
        env:
          EMAIL_PROVIDER: smtp # force MailHog capture; never hit a real provider in CI
        run: docker compose up -d --build
      - name: Wait for services to be ready
        run: |
          # /healthz is intentionally not exposed via Traefik. An unauthenticated
          # call returns 401 once the service is up, routed, and (for auth-svc) has
          # migrated the identity schema the e2e seed needs. 502/000 while down.
          hit() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          for i in $(seq 1 60); do
            # well-formed body so a bad login reaches the DB lookup (401 = schema ready);
            # an empty body would short-circuit at validation (400) before proving the DB.
            login=$(hit -X POST http://localhost/auth/login -H 'Content-Type: application/json' -d '{"email":"x@y.co","password":"z"}')
            send=$(hit -X POST http://localhost/v1/otp/send -d '{}')
            echo "attempt $i: auth-login=$login otp-send=$send"
            [ "$login" = "401" ] && [ "$send" = "401" ] && exit 0
            sleep 2
          done
          echo "services not ready after ~2m"; exit 1
      - name: Run E2E smoke
        env:
          E2E_API_BASE: http://localhost
          E2E_MAILHOG: http://localhost:8025
          MYSQL_DSN: "root:secret@tcp(localhost:3306)/identity?parseTime=true&multiStatements=true"
        run: go test -tags e2e ./test/e2e/...
      - name: Dump logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  build:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [otp-api, auth-svc, otp-dispatcher, seed]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/duykhanh/worklane-${{ matrix.svc }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.svc }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
