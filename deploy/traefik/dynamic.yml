# Traefik dynamic config: route /v1/* to otp-api, /v1/links to link-svc and
# /v1/notifications + /v1/preferences to notification-api, with an edge rate-limit and CORS
# middleware. API-key auth is enforced inside the services, not here.
# Traefik ranks routers by rule length, so a longer PathPrefix wins over PathPrefix(`/v1`);
# the priorities below make that explicit instead of implicit.
http:
  routers:
    otpapi:
      rule: "PathPrefix(`/v1`)"
      entryPoints:
        - web
      service: otpapi
      middlewares:
        - otp-ratelimit
        - otp-cors
    linksvc:
      rule: "PathPrefix(`/v1/links`)"
      priority: 100
      entryPoints:
        - web
      service: linksvc
      middlewares:
        - otp-ratelimit
        - otp-cors
    notificationapi:
      rule: "PathPrefix(`/v1/notifications`) || PathPrefix(`/v1/preferences`)"
      priority: 100
      entryPoints:
        - web
      service: notificationapi
      middlewares:
        - otp-ratelimit
        - otp-cors
    # notification-api's own /v1/templates collides with otp-api's Template Studio routes on
    # the default host, so its full API is reachable on a dedicated host instead. Priority
    # above the path routers so every /v1 path on this host lands on notification-api.
    notificationhost:
      rule: "Host(`notify.localhost`) && PathPrefix(`/v1`)"
      priority: 200
      entryPoints:
        - web
      service: notificationapi
      middlewares:
        - otp-ratelimit
        - otp-cors
    # Public short-link host: GET /:code redirects (302) without auth. *.localhost resolves
    # to loopback, so http://link.localhost/<code> works with no /etc/hosts entry.
    # /metrics is for in-cluster scraping only and is never exposed through the gateway.
    linkredirect:
      rule: "Host(`link.localhost`) && !Path(`/metrics`)"
      priority: 50
      entryPoints:
        - web
      service: linksvc
      middlewares:
        - link-redirect-ratelimit
    authsvc:
      rule: "PathPrefix(`/auth`)"
      entryPoints:
        - web
      service: authsvc
      middlewares:
        - otp-cors

  services:
    otpapi:
      loadBalancer:
        servers:
          - url: "http://otp-api:8888"
    linksvc:
      loadBalancer:
        servers:
          - url: "http://link-svc:8890"
    notificationapi:
      loadBalancer:
        servers:
          - url: "http://notification-api:8891"
    authsvc:
      loadBalancer:
        servers:
          - url: "http://auth-svc:8889"

  middlewares:
    otp-ratelimit:
      rateLimit:
        average: 100
        burst: 50
    # Redirects are public, so they are limited per client IP at the edge (rateLimit
    # groups by the request's remote address by default).
    link-redirect-ratelimit:
      rateLimit:
        average: 50
        burst: 100
    otp-cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - "*"
        accessControlAllowHeaders:
          - authorization
          - content-type
          - idempotency-key
