# Traefik dynamic config: route /v1/* to otp-api, with an edge rate-limit and CORS
# middleware. API-key auth is enforced inside otp-api, not here.
http:
  routers:
    otpapi:
      rule: "PathPrefix(`/v1`)"
      entryPoints:
        - web
      service: otpapi
      middlewares:
        - otp-ratelimit
        - otp-cors
    authsvc:
      rule: "PathPrefix(`/auth`)"
      entryPoints:
        - web
      service: authsvc
      middlewares:
        - otp-cors

  services:
    otpapi:
      loadBalancer:
        servers:
          - url: "http://otp-api:8888"
    authsvc:
      loadBalancer:
        servers:
          - url: "http://auth-svc:8889"

  middlewares:
    otp-ratelimit:
      rateLimit:
        average: 100
        burst: 50
    otp-cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - "*"
        accessControlAllowHeaders:
          - authorization
          - content-type
          - idempotency-key
