apiVersion: apps/v1
kind: Deployment
metadata:
  name: otp-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otp-api
  template:
    metadata:
      labels:
        app: otp-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z mysql 3306 && nc -z redpanda 9092; do echo waiting for mysql+redpanda; sleep 2; done"
      containers:
        - name: otp-api
          image: otp-api # tag pinned by the overlay
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: worklane-config
            - secretRef:
                name: worklane-secrets
          env:
            # otp-api reads MYSQL_DSN; map it to the otp-database DSN.
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: worklane-secrets
                  key: OTP_MYSQL_DSN
            - name: AUTH_JWT_PUBLIC_KEY_FILE
              value: /secrets/auth_pub.pem
          volumeMounts:
            - name: jwt
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8888 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8888 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
      volumes:
        - name: jwt
          secret:
            secretName: worklane-jwt
