apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: link-dispatcher
  template:
    metadata:
      labels:
        app: link-dispatcher
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-schema
          image: busybox:1.36
          # link-svc starts serving after it runs the schema migrations.
          command:
            - sh
            - -c
            - "until wget -q -T 2 -O /dev/null http://link-svc:8890/healthz; do echo waiting for Link schema; sleep 2; done"
      containers:
        - name: link-dispatcher
          image: link-dispatcher # tag pinned by the overlay
          env:
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: worklane-links
                  key: LINK_MYSQL_DSN
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: worklane-config
                  key: KAFKA_BROKERS
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
