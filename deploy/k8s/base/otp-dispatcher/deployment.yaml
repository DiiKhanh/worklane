apiVersion: apps/v1
kind: Deployment
metadata:
  name: otp-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otp-dispatcher
  template:
    metadata:
      labels:
        app: otp-dispatcher
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z mysql 3306 && nc -z redpanda 9092; do echo waiting for mysql+redpanda; sleep 2; done"
      containers:
        - name: otp-dispatcher
          image: otp-dispatcher # tag pinned by the overlay
          envFrom:
            - configMapRef:
                name: worklane-config
            - secretRef:
                name: worklane-secrets
          env:
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: worklane-secrets
                  key: OTP_MYSQL_DSN
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
