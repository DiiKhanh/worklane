apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: worklane-api
spec:
  entryPoints:
    - web
  routes:
    # Public uptime probe. Exact-path (not PathPrefix) so only /healthz is exposed.
    # Handler returns {"status":"ok"} 200, no auth, touches no MySQL/Redis (see
    # services/otp-api/.../handlers.go Health). Deliberately middleware-free: the
    # external monitor should see a clean 200, decoupled from OTP rate-limit/CORS policy.
    - match: Host(`api-otp.dikhanh.io.vn`) && Path(`/healthz`)
      kind: Rule
      services:
        - name: otp-api
          port: 8888
    - match: Host(`api-otp.dikhanh.io.vn`) && PathPrefix(`/v1`)
      kind: Rule
      services:
        - name: otp-api
          port: 8888
      middlewares:
        - name: otp-ratelimit
        - name: otp-cors
    - match: Host(`api-otp.dikhanh.io.vn`) && PathPrefix(`/auth`)
      kind: Rule
      services:
        - name: auth-svc
          port: 8889
      middlewares:
        - name: otp-ratelimit
        - name: otp-cors
