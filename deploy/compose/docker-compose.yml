# Local walking-skeleton stack. Bring up from the repo root:
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
# Web UIs (host): Traefik :8090 · Adminer :8081 · RedisInsight :5540 · Redpanda Console :8085 · MailHog :8025
name: worklane

services:
  # ---- infrastructure ----
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: otp
    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"
    volumes:
      - "./initdb:/docker-entrypoint-initdb.d:ro"

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:v23.3.3
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9092:9092"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + API

  # ---- application services ----
  otp-api:
    build:
      context: ../..
      dockerfile: services/otp-api/Dockerfile
    restart: on-failure # ride out the MySQL first-init restart window (like k8s self-heal)
    environment:
      MYSQL_DSN: "root:secret@tcp(mysql:3306)/otp?parseTime=true&multiStatements=true"
      AUTH_SVC_URL: "http://auth-svc:8889"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-dev-internal-token}"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BROKERS: "redpanda:9092"
      HTTP_ADDR: ":8888"
      # otp-api only verifies JWTs, so it gets the public key (mounted, not committed).
      AUTH_JWT_PUBLIC_KEY_FILE: "/secrets/auth_pub.pem"
    volumes:
      - "./secrets:/secrets:ro"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      auth-svc: { condition: service_started }

  auth-svc:
    build:
      context: ../..
      dockerfile: services/auth-svc/Dockerfile
    restart: on-failure # ride out the MySQL first-init restart window (like k8s self-heal)
    environment:
      MYSQL_DSN: "root:secret@tcp(mysql:3306)/identity?parseTime=true&multiStatements=true"
      REDIS_URL: "redis://redis:6379/0"
      HTTP_ADDR: ":8889"
      AUTH_TOKEN_TTL: "1h"
      # Signing keypair mounted from ./secrets (gitignored); prod supplies its own.
      AUTH_JWT_PRIVATE_KEY_FILE: "/secrets/auth_priv.pem"
      AUTH_JWT_PUBLIC_KEY_FILE: "/secrets/auth_pub.pem"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-dev-internal-token}"
    volumes:
      - "./secrets:/secrets:ro"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  otp-dispatcher:
    build:
      context: ../..
      dockerfile: services/otp-dispatcher/Dockerfile
    restart: on-failure # ride out the MySQL first-init restart window (like k8s self-heal)
    environment:
      MYSQL_DSN: "root:secret@tcp(mysql:3306)/otp?parseTime=true&multiStatements=true"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BROKERS: "redpanda:9092"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-smtp}"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM: "${RESEND_FROM:-OTP <otp@worklane.dev>}"
      RESEND_BASE_URL: "${RESEND_BASE_URL:-https://api.resend.com}"
      # SMS (Twilio) - set the SID/token/from in your host .env (use test credentials locally).
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM: "${TWILIO_FROM:-}"
      TWILIO_BASE_URL: "${TWILIO_BASE_URL:-https://api.twilio.com}"
      # Template fallback (used only when no active DB template exists); {{code}}/{{expiry}} rendered.
      OTP_EMAIL_BODY: "Your verification code is {{code}}. It expires in {{expiry}}."
      OTP_SMS_BODY: "Your verification code is {{code}}. It expires in {{expiry}}."
      OTP_EXPIRY_TEXT: "5 minutes"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      otp-api: { condition: service_started } # otp-api owns migrations; wait for its schema

  link-svc:
    build:
      context: ../..
      dockerfile: services/link-svc/Dockerfile
    restart: on-failure # ride out the MySQL first-init restart window (like k8s self-heal)
    environment:
      # Keep the driver default loc=UTC: clicks are bucketed by UTC day.
      MYSQL_DSN: "root:secret@tcp(mysql:3306)/link?parseTime=true&multiStatements=true"
      AUTH_SVC_URL: "http://auth-svc:8889"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-dev-internal-token}"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BROKERS: "redpanda:9092"
      HTTP_ADDR: ":8890"
      # link-svc only verifies JWTs, so it gets the public key (mounted, not committed).
      AUTH_JWT_PUBLIC_KEY_FILE: "/secrets/auth_pub.pem"
      # Single replica locally; every extra replica needs its own node id (0..1023).
      LINK_NODE_ID: "0"
      # Short links are served on the dedicated host routed in ../traefik/dynamic.yml.
      LINK_PUBLIC_BASE: "${LINK_PUBLIC_BASE:-http://link.localhost}"
    volumes:
      - "./secrets:/secrets:ro"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      auth-svc: { condition: service_started }

  link-dispatcher:
    build:
      context: ../..
      dockerfile: services/link-dispatcher/Dockerfile
    restart: on-failure # ride out the MySQL first-init restart window (like k8s self-heal)
    environment:
      MYSQL_DSN: "root:secret@tcp(mysql:3306)/link?parseTime=true&multiStatements=true"
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      mysql: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      link-svc: { condition: service_started } # link-svc owns migrations; wait for its schema

  # ---- gateway ----
  traefik:
    image: traefik:v3.1
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"     # gateway - curl the API here
      - "8090:8080" # Traefik dashboard
    volumes:
      - "../traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "../traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"

  # ---- developer web UIs (no host installs needed) ----
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8081:8080"

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"

  console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8085:8080"
    depends_on:
      redpanda: { condition: service_started }
